<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Station PRO V3</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn:hover { background-color: var(--accent-hover); }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background-color: var(--border); }

    .swatch-area {
      display: flex;
      gap: 14px;
      align-items: stretch;
      margin-top: 10px;
    }

    .swatch {
      width: 86px;
      height: 86px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #000;
      flex-shrink: 0;
    }

    .match-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .match-code {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .match-name {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .pill {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      width: fit-content;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .delta-val {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .diff-tags {
      display: flex;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 2px;
      font-family: monospace;
    }

    .alt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .alt-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #0f172a80;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .alt-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-swatch {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .coords-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-top: 8px;
    }

    .coord-box {
      background: #0f172a80;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .coord-label {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .coord-value {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
    }
    .actions button { flex: 1; }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Подключение -->
    <div class="card header">
      <div>
        <h1>RAL Scanner PRO V3</h1>
        <div id="bleStatus" style="font-size: 0.8rem; color: var(--text-dim);">Статус: Отключено</div>
      </div>
      <button id="btnConnect" class="btn" onclick="toggleConnect()">Подключить</button>
    </div>

    <!-- Основное совпадение CIEDE2000 -->
    <div class="card">
      <div style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">CIEDE2000 Matching</div>
      <div class="swatch-area">
        <div id="mainSwatch" class="swatch"></div>
        <div class="match-details">
          <div id="mainColorCode" class="match-code">----</div>
          <div id="mainColorName" class="match-name">Ожидание измерения...</div>
          <div id="qualityPill" class="pill" style="color: var(--text-dim); background: #33415540;">---</div>
          <div id="deltaText" class="delta-val">-- <span style="font-size:0.8rem; font-weight:normal; color:var(--text-dim);">ΔE₀₀</span></div>
          <div id="deltaCoords" class="diff-tags">ΔL*: -- | Δa*: -- | Δb*: --</div>
        </div>
      </div>

      <div style="margin-top: 14px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">Альтернативные кандидаты</div>
      <div class="alt-list">
        <div class="alt-item">
          <div class="alt-info">
            <div id="alt1Swatch" class="mini-swatch"></div>
            <span id="alt1Code" style="font-size: 0.85rem;">----</span>
          </div>
          <span id="alt1De" style="font-size: 0.85rem; color: var(--text-dim);">--</span>
        </div>
        <div class="alt-item">
          <div class="alt-info">
            <div id="alt2Swatch" class="mini-swatch"></div>
            <span id="alt2Code" style="font-size: 0.85rem;">----</span>
          </div>
          <span id="alt2De" style="font-size: 0.85rem; color: var(--text-dim);">--</span>
        </div>
      </div>

      <div class="telemetry-row">
        <span>Качество сигнала: <b id="valSigQual" style="color:var(--text);">--%</b></span>
        <span>Повторяемость: <b id="valSigma" style="color:var(--text);">--</b></span>
        <span>АЦП: <b id="valSat" style="color:var(--success);">OK</b></span>
      </div>
    </div>

    <!-- Метрологические координаты D65 / 10° -->
    <div class="card">
      <div style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">CIE Lab & XYZ (D65 / 10°)</div>
      <div class="coords-grid">
        <div class="coord-box">
          <div class="coord-label">L*</div>
          <div id="valL" class="coord-value">0.0</div>
        </div>
        <div class="coord-box">
          <div class="coord-label">a*</div>
          <div id="valA" class="coord-value">0.0</div>
        </div>
        <div class="coord-box">
          <div class="coord-label">b*</div>
          <div id="valB" class="coord-value">0.0</div>
        </div>
      </div>
    </div>

    <!-- Быстрая калибровка NVS -->
    <div class="card">
      <div style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-bottom: 8px;">Базовая калибровка (NVS)</div>
      <div class="actions">
        <button class="btn btn-outline" style="font-size: 0.8rem;" onclick="sendCalibCmd('CAL_WHITE')">Калибр. Белый</button>
        <button class="btn btn-outline" style="font-size: 0.8rem;" onclick="sendCalibCmd('CAL_BLACK')">Калибр. Черный</button>
      </div>
    </div>

    <!-- Управление и сборщик датасета для регрессии -->
    <div class="actions">
      <button class="btn" onclick="sendScanCmd()">Сделать замер</button>
      <button class="btn btn-outline" onclick="addToDataset()">Сохранить для регрессии</button>
      <button class="btn btn-outline" onclick="exportDataset()">Скачать CSV</button>
    </div>
  </div>

    // ========================================================================
    // ТОЧНАЯ МЕТРИКА CIEDE2000
    // ========================================================================
    function deltaE00(l1, a1, b1, l2, a2, b2) {
      const deg2rad = Math.PI / 180;
      const rad2deg = 180 / Math.PI;

      const avgLp = (l1 + l2) / 2;
      const c1 = Math.sqrt(a1 * a1 + b1 * b1);
      const c2 = Math.sqrt(a2 * a2 + b2 * b2);
      const avgC = (c1 + c2) / 2;

      const G = 0.5 * (1 - Math.sqrt(Math.pow(avgC, 7) / (Math.pow(avgC, 7) + Math.pow(25, 7))));
      const a1p = (1 + G) * a1;
      const a2p = (1 + G) * a2;

      const c1p = Math.sqrt(a1p * a1p + b1 * b1);
      const c2p = Math.sqrt(a2p * a2p + b2 * b2);
      const avgCp = (c1p + c2p) / 2;

      let h1p = Math.atan2(b1, a1p) * rad2deg;
      if (h1p < 0) h1p += 360;
      let h2p = Math.atan2(b2, a2p) * rad2deg;
      if (h2p < 0) h2p += 360;

      let avghp = Math.abs(h1p - h2p) > 180 ? (h1p + h2p + 360) / 2 : (h1p + h2p) / 2;
      const T = 1 - 0.17 * Math.cos((avghp - 30) * deg2rad)
                  + 0.24 * Math.cos((2 * avghp) * deg2rad)
                  + 0.32 * Math.cos((3 * avghp + 6) * deg2rad)
                  - 0.20 * Math.cos((4 * avghp - 63) * deg2rad);

      let deltahp = h2p - h1p;
      if (Math.abs(deltahp) > 180) {
        deltahp = h2p <= h1p ? deltahp + 360 : deltahp - 360;
      }
      const deltaLp = l2 - l1;
      const deltaCp = c2p - c1p;
      const deltaHp = 2 * Math.sqrt(c1p * c2p) * Math.sin((deltahp / 2) * deg2rad);

      const Sl = 1 + (0.015 * Math.pow(avgLp - 50, 2)) / Math.sqrt(20 + Math.pow(avgLp - 50, 2));
      const Sc = 1 + 0.045 * avgCp;
      const Sh = 1 + 0.015 * avgCp * T;

      const deltaTheta = 30 * Math.exp(-Math.pow((avghp - 275) / 25, 2));
      const Rc = 2 * Math.sqrt(Math.pow(avgCp, 7) / (Math.pow(avgCp, 7) + Math.pow(25, 7)));
      const Rt = -Math.sin(2 * deltaTheta * deg2rad) * Rc;

      return Math.sqrt(
        Math.pow(deltaLp / Sl, 2) +
        Math.pow(deltaCp / Sc, 2) +
        Math.pow(deltaHp / Sh, 2) +
        Rt * (deltaCp / Sc) * (deltaHp / Sh)
      );
    }

    function labToRgb(l, a, b) {
      let y = (l + 16) / 116;
      let x = a / 500 + y;
      let z = y - b / 200;

      const fn = t => (t > 0.008856 ? Math.pow(t, 3) : (t - 16 / 116) / 7.787);
      x = 0.95047 * fn(x);
      y = 1.00000 * fn(y);
      z = 1.08883 * fn(z);

      let r = x * 3.2406 + y * -1.5372 + z * -0.4986;
      let g = x * -0.9689 + y * 1.8758 + z * 0.0415;
      let bl = x * 0.0557 + y * -0.2040 + z * 1.0570;

      const adj = c => (c > 0.0031308 ? 1.055 * Math.pow(c, 1 / 2.4) - 0.055 : 12.92 * c);
      return [
        Math.min(255, Math.max(0, Math.round(adj(r) * 255))),
        Math.min(255, Math.max(0, Math.round(adj(g) * 255))),
        Math.min(255, Math.max(0, Math.round(adj(bl) * 255)))
      ];
    }

    // ========================================================================
    // ОБРАБОТКА МЕТРОЛОГИЧЕСКОГО СОВПАДЕНИЯ (ТОЛЬКО ЧИСТЫЙ dE00)
    // ========================================================================
    let lastScanData = null;
    let calibrationDataset = [];

    function processColorMatch(L, a, b) {
      const list = CATALOGS.ral_classic;

      let ranked = list.map(item => {
        const dE = deltaE00(L, a, b, item.L, item.a, item.b);
        return {
          ...item,
          dE: dE,
          dL: L - item.L,
          da: a - item.a,
          db: b - item.b
        };
      }).sort((x, y) => x.dE - y.dE);

      const top1 = ranked[0];
      const top2 = ranked[1];
      const top3 = ranked[2];

      document.getElementById('mainColorCode').innerText = top1.code;
      document.getElementById('mainColorName').innerText = top1.name;
      document.getElementById('deltaText').innerHTML = `${top1.dE.toFixed(2)} <span style="font-size:0.8rem; font-weight:normal; color:var(--text-dim);">ΔE₀₀</span>`;

      document.getElementById('deltaCoords').innerText = 
        `ΔL*: ${top1.dL > 0 ? '+' : ''}${top1.dL.toFixed(1)} | Δa*: ${top1.da > 0 ? '+' : ''}${top1.da.toFixed(1)} | Δb*: ${top1.db > 0 ? '+' : ''}${top1.db.toFixed(1)}`;

      // Шкала метрологической оценки
      const pill = document.getElementById('qualityPill');
      if (top1.dE < 1.0) {
        pill.innerText = "ОЧЕНЬ БЛИЗКО (< 1.0)"; pill.style.color = "var(--success)"; pill.style.background = "#05966930";
      } else if (top1.dE < 2.0) {
        pill.innerText = "БЛИЗКО (1.0 - 2.0)"; pill.style.color = "#38bdf8"; pill.style.background = "#0284c730";
      } else if (top1.dE < 3.0) {
        pill.innerText = "ПРИЕМЛЕМО (2.0 - 3.0)"; pill.style.color = "var(--warning)"; pill.style.background = "#d9770630";
      } else if (top1.dE < 5.0) {
        pill.innerText = "ЗАМЕТНОЕ ОТЛИЧИЕ (3.0 - 5.0)"; pill.style.color = "#fb923c"; pill.style.background = "#c2410c30";
      } else {
        pill.innerText = "СУЩЕСТВЕННОЕ ОТЛИЧИЕ (> 5.0)"; pill.style.color = "var(--danger)"; pill.style.background = "#b91c1c30";
      }

      let [r1, g1, b1] = labToRgb(top1.L, top1.a, top1.b);
      document.getElementById('mainSwatch').style.backgroundColor = `rgb(${r1},${g1},${b1})`;

      if (top2) {
        document.getElementById('alt1Code').innerText = `${top2.code} (${top2.name})`;
        document.getElementById('alt1De').innerText = `ΔE ${top2.dE.toFixed(2)}`;
        let [r2, g2, b2] = labToRgb(top2.L, top2.a, top2.b);
        document.getElementById('alt1Swatch').style.backgroundColor = `rgb(${r2},${g2},${b2})`;
      }
      if (top3) {
        document.getElementById('alt2Code').innerText = `${top3.code} (${top3.name})`;
        document.getElementById('alt2De').innerText = `ΔE ${top3.dE.toFixed(2)}`;
        let [r3, g3, b3] = labToRgb(top3.L, top3.a, top3.b);
        document.getElementById('alt2Swatch').style.backgroundColor = `rgb(${r3},${g3},${b3})`;
      }
    }

    // ========================================================================
    // BLE STREAM PARSER С ФРЕЙМИНГОМ
    // ========================================================================
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxChar = null;
    let rxBuffer = "";

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }

      try {
        document.getElementById('bleStatus').innerText = "Поиск прибора V3...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "RAL-Scanner-PRO" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          document.getElementById('bleStatus').innerText = "Статус: Отключено";
          document.getElementById('btnConnect').innerText = "Подключить";
          document.getElementById('btnConnect').classList.remove('btn-outline');
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxChar = await service.getCharacteristic(CHAR_RX_UUID);
        const txChar = await service.getCharacteristic(CHAR_TX_UUID);

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleBleChunk);

        document.getElementById('bleStatus').innerText = "Статус: Подключено V3";
        document.getElementById('btnConnect').innerText = "Отключить";
        document.getElementById('btnConnect').classList.add('btn-outline');
      } catch (err) {
        console.error(err);
        document.getElementById('bleStatus').innerText = "Ошибка подключения";
      }
    }

    function handleBleChunk(event) {
      const decoder = new TextDecoder('utf-8');
      rxBuffer += decoder.decode(event.target.value);

      let lineEnd;
      while ((lineEnd = rxBuffer.indexOf('\n')) >= 0) {
        const line = rxBuffer.substring(0, lineEnd).trim();
        rxBuffer = rxBuffer.substring(lineEnd + 1);
        if (line.length > 0) parseJsonPacket(line);
      }
    }

    function parseJsonPacket(jsonStr) {
      try {
        const data = JSON.parse(jsonStr);
        lastScanData = data;

        // Телеметрия
        document.getElementById('valSigQual').innerText = `${data.sigQual}%`;
        document.getElementById('valSigma').innerText = `σ: ${(data.sigma * 100).toFixed(2)}%`;

        const satEl = document.getElementById('valSat');
        if (data.satHard > 0) {
          satEl.innerText = `CLIP (0x${data.satHard.toString(16)})`;
          satEl.style.color = "var(--danger)";
        } else if (data.satWarn > 0) {
          satEl.innerText = `WARN (0x${data.satWarn.toString(16)})`;
          satEl.style.color = "var(--warning)";
        } else {
          satEl.innerText = "OK";
          satEl.style.color = "var(--success)";
        }

        if (data.lab && data.lab.length === 3) {
          const [L, a, b] = data.lab;
          document.getElementById('valL').innerText = L.toFixed(2);
          document.getElementById('valA').innerText = a.toFixed(2);
          document.getElementById('valB').innerText = b.toFixed(2);
          processColorMatch(L, a, b);
        }
      } catch (e) {
        console.error("V3 JSON parse err:", e, jsonStr);
      }
    }

    async function sendScanCmd() {
      if (!rxChar) { alert("Прибор не подключен"); return; }
      const encoder = new TextEncoder();
      await rxChar.writeValue(encoder.encode("SCAN\n"));
    }

    async function sendCalibCmd(cmd) {
      if (!rxChar) { alert("Прибор не подключен"); return; }
      const encoder = new TextEncoder();
      await rxChar.writeValue(encoder.encode(cmd + "\n"));
    }

    // ========================================================================
    // МОДУЛЬ СБОРА ДАТАСЕТА ДЛЯ РАСЧЕТА МАТРИЦЫ РЕГРЕССИИ
    // ========================================================================
    function addToDataset() {
      if (!lastScanData || !lastScanData.refl) {
        alert("Сначала сделайте замер эталонной пластины RAL!");
        return;
      }
      const label = prompt("Введите эталонный код RAL (например: 1021, 3020, 7024):");
      if (!label) return;

      const cleanCode = "RAL " + label.replace(/[^\d]/g, '');
      const refItem = CATALOGS.ral_classic.find(x => x.code === cleanCode);

      if (!refItem) {
        alert("Такой RAL не найден в каталоге!");
        return;
      }

      calibrationDataset.push({
        ral: refItem.code,
        name: refItem.name,
        target_L: refItem.L,
        target_a: refItem.a,
        target_b: refItem.b,
        R1: lastScanData.refl[0],
        R2: lastScanData.refl[1],
        R3: lastScanData.refl[2],
        R4: lastScanData.refl[3],
        R5: lastScanData.refl[4],
        R6: lastScanData.refl[5],
        R7: lastScanData.refl[6],
        R8: lastScanData.refl[7]
      });

      alert(`Образец ${cleanCode} добавлен! Всего в датасете: ${calibrationDataset.length}`);
    }

    function exportDataset() {
      if (calibrationDataset.length === 0) {
        alert("Датасет пуст. Сделайте замеры и добавьте их в базу!");
        return;
      }

      let csv = "RAL,Name,Target_L,Target_a,Target_b,R1,R2,R3,R4,R5,R6,R7,R8\n";
      calibrationDataset.forEach(row => {
        csv += `${row.ral},"${row.name}",${row.target_L},${row.target_a},${row.target_b},` +
               `${row.R1},${row.R2},${row.R3},${row.R4},${row.R5},${row.R6},${row.R7},${row.R8}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `as7341_dataset_${calibrationDataset.length}_samples.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
