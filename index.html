<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RAL Scanner</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141b2d;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) 16px;
      overflow: hidden;
    }

    /* Навбар */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      flex-shrink: 0;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .btn-connect {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn-connect:active { transform: scale(0.96); }

    /* Основная рабочая область */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    /* Главная плашка */
    .hero-swatch {
      flex: 1.2;
      border-radius: 24px;
      position: relative;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      transition: background-color 0.3s ease;
      min-height: 180px;
    }
    .hero-swatch-top {
      display: flex;
      justify-content: flex-end;
    }
    .hero-swatch-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .badge {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .lab-box {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.9);
    }

    /* Карточка с инфой */
    .hero-details {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ral-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .ral-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .ral-subtitle {
      font-size: 17px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: #60a5fa;
      margin-top: 2px;
    }

    /* Альтернативы */
    .alt-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .alt-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-left: 4px;
    }
    .alt-row {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 14px;
      gap: 12px;
    }
    .alt-swatch {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }
    .alt-name {
      font-size: 16px;
      font-weight: 700;
      flex: 1;
    }
    .alt-de {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Заголовок / Подключение -->
  <header class="app-header">
    <div class="status-pill">
      <div id="dot" class="dot"></div>
      <span id="status">Отключено</span>
    </div>
    <button id="connectBtn" class="btn-connect" onclick="toggleConnect()">Подключить</button>
  </header>

  <main class="main-content">
    <!-- Доминирующая цветная плашка -->
    <div id="heroSwatch" class="hero-swatch">
      <div class="hero-swatch-top">
        <div id="badge" class="badge">---</div>
      </div>
      <div class="hero-swatch-bottom">
        <div id="labValues" class="lab-box">L: -- a: -- b: --</div>
      </div>
    </div>

    <!-- Инфо-панель -->
    <div class="hero-details">
      <div>
        <div class="ral-header">
          <div id="ralCode" class="ral-title">RAL ----</div>
          <div class="ral-subtitle" id="ralName">Ожидание...</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Разница цвета</span>
          <span class="stat-val"><span id="deVal">0.00</span> <span style="font-size: 14px; font-weight: normal; color: var(--text-muted);">ΔE00</span></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Точность</span>
          <span class="stat-val"><span id="confVal">0</span>%</span>
        </div>
      </div>
    </div>

    <!-- Альтернативы -->
    <div class="alt-container">
      <div class="alt-title">Ближайшие совпадения</div>
      <div class="alt-row">
        <div id="alt1Swatch" class="alt-swatch"></div>
        <div id="alt1Code" class="alt-name">RAL ----</div>
        <div id="alt1De" class="alt-de">ΔE --</div>
      </div>
      <div class="alt-row">
        <div id="alt2Swatch" class="alt-swatch"></div>
        <div id="alt2Code" class="alt-name">RAL ----</div>
        <div id="alt2De" class="alt-de">ΔE --</div>
      </div>
    </div>
  </main>

<script>
  const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  let bleDevice = null;

  const ralRefLab = {
    "RAL 1000": [76.5, 1.2, 28.1],   "RAL 1001": [75.8, 5.7, 26.2],   "RAL 1002": [73.2, 7.4, 39.6],
    "RAL 1013": [86.8, 0.4, 10.8],   "RAL 1014": [80.4, 3.7, 24.1],   "RAL 1015": [84.4, 2.8, 16.9],
    "RAL 1019": [64.2, 3.8, 15.4],   "RAL 1020": [60.8, 1.2, 25.6],   "RAL 1023": [78.4, 11.2, 78.8],
    "RAL 1035": [56.4, 2.2, 10.8],   "RAL 2002": [45.8, 51.4, 44.2],  "RAL 3000": [45.2, 50.1, 37.4],
    "RAL 3001": [41.2, 50.8, 32.1],  "RAL 3007": [21.2, 18.4, 5.6],   "RAL 3012": [61.4, 21.8, 22.4],
    "RAL 3014": [58.4, 32.8, 16.8],  "RAL 3015": [69.8, 24.1, 11.8],  "RAL 3016": [44.2, 41.8, 31.2],
    "RAL 3018": [48.4, 52.1, 24.6],  "RAL 3020": [46.9, 59.8, 44.5],  "RAL 3027": [41.2, 52.4, 26.4],
    "RAL 3028": [45.8, 62.4, 43.1],  "RAL 5001": [31.2, -16.4, -21.2],"RAL 5002": [24.1, 13.5, -44.8],
    "RAL 5003": [22.4, 0.8, -24.1],  "RAL 5005": [33.2, -1.9, -37.2], "RAL 5013": [20.8, 3.4, -26.4],
    "RAL 5015": [48.2, -13.5, -31.7],"RAL 5017": [28.4, -7.4, -28.4], "RAL 5019": [37.4, -12.4, -27.4],
    "RAL 5022": [21.2, 8.4, -31.2],  "RAL 6004": [26.4, -18.4, -2.4], "RAL 6016": [40.1, -36.4, 8.4],
    "RAL 6026": [36.4, -34.2, 4.8],  "RAL 6028": [35.4, -18.4, 4.8],  "RAL 6036": [32.1, -28.4, 2.4],
    "RAL 7004": [65.4, -0.4, -0.8],  "RAL 7016": [29.3, -0.6, -3.7],  "RAL 7024": [33.7, -0.7, -2.9],
    "RAL 7032": [72.4, -0.4, 7.8],   "RAL 7034": [58.4, -0.4, 10.8],  "RAL 7035": [82.1, -1.0, 0.8],
    "RAL 7036": [62.4, 0.8, 0.4],    "RAL 7038": [73.4, -0.8, 2.4],   "RAL 7040": [67.2, -1.4, -2.8],
    "RAL 7044": [73.8, 0.4, 6.4],    "RAL 8014": [26.4, 9.8, 12.4],   "RAL 8016": [25.4, 17.4, 14.2],
    "RAL 8017": [25.8, 7.6, 9.8],    "RAL 8022": [16.4, 0.8, 0.8],    "RAL 9001": [91.2, -0.8, 5.8],
    "RAL 9003": [95.2, -0.6, 1.8],   "RAL 9005": [5.1, 0.1, -0.5],    "RAL 9006": [68.4, -0.8, 0.4],
    "RAL 9010": [93.8, 0.2, 5.1],    "RAL 9011": [16.4, -0.4, -0.8],  "RAL 9016": [96.1, -0.2, 1.1],
    "RAL 9017": [16.8, 0.2, -0.2]
  };

  function labToRgb(L, a, b) {
    let y = (L + 16) / 116;
    let x = a / 500 + y;
    let z = y - b / 200;

    const fn = (t) => t > 0.206893 ? Math.pow(t, 3) : (t - 16/116) / 7.787;
    x = 0.95047 * fn(x);
    y = 1.00000 * fn(y);
    z = 1.08883 * fn(z);

    let r = x *  3.2406 + y * -1.5372 + z * -0.4986;
    let g = x * -0.9689 + y *  1.8758 + z *  0.0415;
    let bl = x *  0.0557 + y * -0.2040 + z *  1.0570;

    const gamma = (c) => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055;
    r = Math.min(255, Math.max(0, Math.round(gamma(r) * 255)));
    g = Math.min(255, Math.max(0, Math.round(gamma(g) * 255)));
    bl = Math.min(255, Math.max(0, Math.round(gamma(bl) * 255)));

    return `rgb(${r}, ${g}, ${bl})`;
  }

  function getRalColor(ralCode) {
    if (ralRefLab[ralCode]) {
      const [l, a, b] = ralRefLab[ralCode];
      return labToRgb(l, a, b);
    }
    return "#1e293b";
  }

  async function toggleConnect() {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      return;
    }

    try {
      document.getElementById('status').innerText = "Поиск...";
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: "RAL-Scanner-PRO" }],
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      document.getElementById('status').innerText = "Связь...";
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const txChar = await service.getCharacteristic(CHAR_TX_UUID);

      await txChar.startNotifications();
      txChar.addEventListener('characteristicvaluechanged', handleTelemetry);

      document.getElementById('status').innerText = "В сети";
      document.getElementById('dot').classList.add('connected');
      document.getElementById('connectBtn').innerText = "Отключить";
      document.getElementById('connectBtn').style.background = "#dc2626";

    } catch (error) {
      document.getElementById('status').innerText = "Ошибка";
      document.getElementById('dot').classList.remove('connected');
    }
  }

  function onDisconnected() {
    document.getElementById('status').innerText = "Отключено";
    document.getElementById('dot').classList.remove('connected');
    document.getElementById('connectBtn').innerText = "Подключить";
    document.getElementById('connectBtn').style.background = "#2563eb";
  }

  function handleTelemetry(event) {
    const raw = new TextDecoder().decode(event.target.value);
    try {
      const data = JSON.parse(raw);

      document.getElementById('ralCode').innerText = data.ral;
      document.getElementById('ralName').innerText = data.name;
      document.getElementById('deVal').innerText = Number(data.dE).toFixed(2);
      document.getElementById('confVal').innerText = data.confidence;

      const badge = document.getElementById('badge');
      badge.innerText = data.quality;
      if (data.dE < 2.0) {
        badge.style.color = "#4ade80";
      } else if (data.dE < 4.0) {
        badge.style.color = "#facc15";
      } else {
        badge.style.color = "#f87171";
      }

      if (data.lab) {
        const rgb = labToRgb(data.lab[0], data.lab[1], data.lab[2]);
        document.getElementById('heroSwatch').style.backgroundColor = rgb;
        document.getElementById('labValues').innerText = 
          `L: ${Number(data.lab[0]).toFixed(1)}  a: ${Number(data.lab[1]).toFixed(1)}  b: ${Number(data.lab[2]).toFixed(1)}`;
      }

      if (data.alternatives && data.alternatives.length >= 2) {
        const alt1 = data.alternatives[0];
        const alt2 = data.alternatives[1];

        document.getElementById('alt1Code').innerText = alt1.ral;
        document.getElementById('alt1De').innerText = `ΔE ${Number(alt1.dE).toFixed(1)}`;
        document.getElementById('alt1Swatch').style.backgroundColor = getRalColor(alt1.ral);

        document.getElementById('alt2Code').innerText = alt2.ral;
        document.getElementById('alt2De').innerText = `ΔE ${Number(alt2.dE).toFixed(1)}`;
        document.getElementById('alt2Swatch').style.backgroundColor = getRalColor(alt2.ral);
      }

    } catch (e) {
      console.warn("Ошибка JSON:", e);
    }
  }
</script>

</body>
</html>
