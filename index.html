<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Station PRO</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #4ade80;
      --warning: #facc15;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background-color: var(--border);
    }

    .swatch-area {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin-top: 8px;
    }

    .swatch {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #000;
      flex-shrink: 0;
    }

    .match-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .match-code {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .match-name {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      width: fit-content;
      margin-top: 4px;
    }

    .delta-val {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 6px;
    }

    .alt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .alt-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #0f172a80;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .alt-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-swatch {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .coords-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-top: 8px;
    }

    .coord-box {
      background: #0f172a80;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .coord-label {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .coord-value {
      font-size: 1rem;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Подключение -->
    <div class="card header">
      <div>
        <h1>Color Station PRO</h1>
        <div id="bleStatus" style="font-size: 0.8rem; color: var(--text-dim);">Статус: Отключено</div>
      </div>
      <button id="btnConnect" class="btn" onclick="toggleConnect()">Подключить</button>
    </div>

    <!-- Результат сравнения -->
    <div class="card">
      <div style="font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">Основное совпадение</div>
      <div class="swatch-area">
        <div id="mainSwatch" class="swatch"></div>
        <div class="match-details">
          <div id="mainColorCode" class="match-code">----</div>
          <div id="mainColorName" class="match-name">Ожидание замера...</div>
          <div id="qualityPill" class="pill" style="color: var(--text-dim);">---</div>
          <div id="deltaText" class="delta-val">-- <span style="font-size:0.8rem; font-weight:normal; color:var(--text-dim);">ΔE</span></div>
        </div>
      </div>

      <div style="margin-top: 16px; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">Ближайшие артикулы</div>
      <div class="alt-list">
        <div class="alt-item">
          <div class="alt-info">
            <div id="alt1Swatch" class="mini-swatch"></div>
            <span id="alt1Code" style="font-size: 0.9rem;">----</span>
          </div>
          <span id="alt1De" style="font-size: 0.85rem; color: var(--text-dim);">--</span>
        </div>
        <div class="alt-item">
          <div class="alt-info">
            <div id="alt2Swatch" class="mini-swatch"></div>
            <span id="alt2Code" style="font-size: 0.9rem;">----</span>
          </div>
          <span id="alt2De" style="font-size: 0.85rem; color: var(--text-dim);">--</span>
        </div>
      </div>
    </div>

    <!-- Координаты CIE Lab -->
    <div class="card">
      <div style="font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">Координаты CIE Lab</div>
      <div class="coords-grid">
        <div class="coord-box">
          <div class="coord-label">L*</div>
          <div id="valL" class="coord-value">0.0</div>
        </div>
        <div class="coord-box">
          <div class="coord-label">a*</div>
          <div id="valA" class="coord-value">0.0</div>
        </div>
        <div class="coord-box">
          <div class="coord-label">b*</div>
          <div id="valB" class="coord-value">0.0</div>
        </div>
      </div>
    </div>

    <!-- Управление -->
    <div class="actions">
      <button class="btn" onclick="sendScanCmd()">Сделать замер</button>
      <button class="btn btn-outline" onclick="exportData()">Экспорт</button>
    </div>
  </div>

    let currentCatalog = "ral_classic";

    // Спектральные эталоны (каналы F2..F8)
    const RAL_SPECTRAL_FINGERPRINTS = {
      "1021": [0.156, 0.273, 0.443, 0.803, 0.879, 0.876, 0.879],
      "1017": [0.180, 0.280, 0.220, 0.580, 0.780, 0.810, 0.830],
      "3020": [0.044, 0.076, 0.033, 0.225, 0.394, 0.659, 0.688],
      "3018": [0.100, 0.140, 0.120, 0.280, 0.460, 0.650, 0.750],
      "3024": [0.030, 0.050, 0.020, 0.310, 0.520, 0.820, 0.890],
      "9003": [1.000, 1.000, 1.000, 1.000, 1.000, 1.000, 1.000],
      "9005": [0.011, 0.012, 0.011, 0.010, 0.010, 0.010, 0.007]
    };

    // ========================================================================
    // CIEDE2000 МАТЕМАТИКА
    // ========================================================================
    function deltaE00(l1, a1, b1, l2, a2, b2) {
      const deg2rad = Math.PI / 180;
      const rad2deg = 180 / Math.PI;

      const avgLp = (l1 + l2) / 2;
      const c1 = Math.sqrt(a1 * a1 + b1 * b1);
      const c2 = Math.sqrt(a2 * a2 + b2 * b2);
      const avgC = (c1 + c2) / 2;

      const G = 0.5 * (1 - Math.sqrt(Math.pow(avgC, 7) / (Math.pow(avgC, 7) + Math.pow(25, 7))));
      const a1p = (1 + G) * a1;
      const a2p = (1 + G) * a2;

      const c1p = Math.sqrt(a1p * a1p + b1 * b1);
      const c2p = Math.sqrt(a2p * a2p + b2 * b2);
      const avgCp = (c1p + c2p) / 2;

      let h1p = Math.atan2(b1, a1p) * rad2deg;
      if (h1p < 0) h1p += 360;
      let h2p = Math.atan2(b2, a2p) * rad2deg;
      if (h2p < 0) h2p += 360;

      let avghp = Math.abs(h1p - h2p) > 180 ? (h1p + h2p + 360) / 2 : (h1p + h2p) / 2;
      const T = 1 - 0.17 * Math.cos((avghp - 30) * deg2rad)
                  + 0.24 * Math.cos((2 * avghp) * deg2rad)
                  + 0.32 * Math.cos((3 * avghp + 6) * deg2rad)
                  - 0.20 * Math.cos((4 * avghp - 63) * deg2rad);

      let deltahp = h2p - h1p;
      if (Math.abs(deltahp) > 180) {
        deltahp = h2p <= h1p ? deltahp + 360 : deltahp - 360;
      }
      const deltaLp = l2 - l1;
      const deltaCp = c2p - c1p;
      const deltaHp = 2 * Math.sqrt(c1p * c2p) * Math.sin((deltahp / 2) * deg2rad);

      const Sl = 1 + (0.015 * Math.pow(avgLp - 50, 2)) / Math.sqrt(20 + Math.pow(avgLp - 50, 2));
      const Sc = 1 + 0.045 * avgCp;
      const Sh = 1 + 0.015 * avgCp * T;

      const deltaTheta = 30 * Math.exp(-Math.pow((avghp - 275) / 25, 2));
      const Rc = 2 * Math.sqrt(Math.pow(avgCp, 7) / (Math.pow(avgCp, 7) + Math.pow(25, 7)));
      const Rt = -Math.sin(2 * deltaTheta * deg2rad) * Rc;

      return Math.sqrt(
        Math.pow(deltaLp / Sl, 2) +
        Math.pow(deltaCp / Sc, 2) +
        Math.pow(deltaHp / Sh, 2) +
        Rt * (deltaCp / Sc) * (deltaHp / Sh)
      );
    }

    function labToRgb(l, a, b) {
      let y = (l + 16) / 116;
      let x = a / 500 + y;
      let z = y - b / 200;

      const fn = t => (t > 0.206897 ? Math.pow(t, 3) : (t - 16 / 116) / 7.787);
      x = 0.95047 * fn(x);
      y = 1.00000 * fn(y);
      z = 1.08883 * fn(z);

      let r = x * 3.2406 + y * -1.5372 + z * -0.4986;
      let g = x * -0.9689 + y * 1.8758 + z * 0.0415;
      let bl = x * 0.0557 + y * -0.2040 + z * 1.0570;

      const adj = c => (c > 0.0031308 ? 1.055 * Math.pow(c, 1 / 2.4) - 0.055 : 12.92 * c);
      return [
        Math.min(255, Math.max(0, Math.round(adj(r) * 255))),
        Math.min(255, Math.max(0, Math.round(adj(g) * 255))),
        Math.min(255, Math.max(0, Math.round(adj(bl) * 255)))
      ];
    }

    // ========================================================================
    // ОБРАБОТКА ДАННЫХ И ПОИСК В КАТАЛОГЕ
    // ========================================================================
    let lastReportData = null;

    function updateCatalogSearch(L, a, b, measuredRefl) {
      const list = CATALOGS[currentCatalog];

      let normMeasured = null;
      if (measuredRefl && Array.isArray(measuredRefl) && measuredRefl.length >= 8) {
        const cleanRefl = measuredRefl.slice(1);
        const sum = cleanRefl.reduce((acc, v) => acc + v, 0) || 1.0;
        normMeasured = cleanRefl.map(v => v / sum);
      }

      let ranked = list.map(item => {
        const dE = deltaE00(L, a, b, item.L, item.a, item.b);
        let spectralDistance = 0.0;
        let hasFingerprint = false;

        const pureCode = item.code.replace(/[^\d]/g, '');
        const refFingerprint = RAL_SPECTRAL_FINGERPRINTS[pureCode];

        if (refFingerprint && normMeasured) {
          hasFingerprint = true;
          const refSum = refFingerprint.reduce((acc, v) => acc + v, 0) || 1.0;
          const normRef = refFingerprint.map(v => v / refSum);

          const sumSquares = normMeasured.reduce((acc, val, idx) => {
            return acc + Math.pow(val - normRef[idx], 2);
          }, 0);
          spectralDistance = Math.sqrt(sumSquares);
        }

        let combinedScore = dE;
        if (hasFingerprint) {
          combinedScore = dE * 0.7 + (spectralDistance * 30.0) * 0.3;
        }

        return {
          ...item,
          dE: dE,
          spectralDistance: spectralDistance,
          combinedScore: combinedScore
        };
      }).sort((x, y) => x.combinedScore - y.combinedScore);

      const top1 = ranked[0];
      const top2 = ranked[1];
      const top3 = ranked[2];

      document.getElementById('mainColorCode').innerText = top1.code;
      document.getElementById('mainColorName').innerText = top1.name;
      document.getElementById('deltaText').innerHTML = `${top1.dE.toFixed(2)} <span style="font-size:0.8rem; font-weight:normal; color:var(--text-dim);">ΔE</span>`;

      const pill = document.getElementById('qualityPill');
      if (top1.dE < 3.0) {
        pill.innerText = "ИДЕАЛЬНОЕ СОВПАДЕНИЕ"; pill.style.color = "var(--success)";
      } else if (top1.dE < 6.0) {
        pill.innerText = "ХОРОШЕЕ ПОПАДАНИЕ"; pill.style.color = "var(--warning)";
      } else {
        pill.innerText = "ПРИБЛИЗИТЕЛЬНЫЙ ОТТЕНОК"; pill.style.color = "var(--danger)";
      }

      let [r1, g1, b1] = labToRgb(top1.L, top1.a, top1.b);
      document.getElementById('mainSwatch').style.backgroundColor = `rgb(${r1},${g1},${b1})`;

      if (top2) {
        document.getElementById('alt1Code').innerText = `${top2.code} (${top2.name})`;
        document.getElementById('alt1De').innerText = `ΔE ${top2.dE.toFixed(1)}`;
        let [r2, g2, b2] = labToRgb(top2.L, top2.a, top2.b);
        document.getElementById('alt1Swatch').style.backgroundColor = `rgb(${r2},${g2},${b2})`;
      }
      if (top3) {
        document.getElementById('alt2Code').innerText = `${top3.code} (${top3.name})`;
        document.getElementById('alt2De').innerText = `ΔE ${top3.dE.toFixed(1)}`;
        let [r3, g3, b3] = labToRgb(top3.L, top3.a, top3.b);
        document.getElementById('alt2Swatch').style.backgroundColor = `rgb(${r3},${g3},${b3})`;
      }

      lastReportData = {
        code: top1.code,
        name: top1.name,
        dE: top1.dE.toFixed(2),
        catalog: currentCatalog.toUpperCase()
      };
    }

    // ========================================================================
    // BLE УПРАВЛЕНИЕ
    // ========================================================================
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxChar = null;

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }

      try {
        document.getElementById('bleStatus').innerText = "Поиск прибора...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "RAL-Scanner-PRO" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          document.getElementById('bleStatus').innerText = "Статус: Отключено";
          document.getElementById('btnConnect').innerText = "Подключить";
          document.getElementById('btnConnect').classList.remove('btn-outline');
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxChar = await service.getCharacteristic(CHAR_RX_UUID);
        const txChar = await service.getCharacteristic(CHAR_TX_UUID);

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleBleData);

        document.getElementById('bleStatus').innerText = "Статус: Подключено (BLE)";
        document.getElementById('btnConnect').innerText = "Отключить";
        document.getElementById('btnConnect').classList.add('btn-outline');
      } catch (err) {
        console.error(err);
        document.getElementById('bleStatus').innerText = "Ошибка подключения";
      }
    }

    function handleBleData(event) {
      const decoder = new TextDecoder('utf-8');
      const jsonStr = decoder.decode(event.target.value);
      try {
        const data = JSON.parse(jsonStr);
        if (data.lab && data.lab.length === 3) {
          const [L, a, b] = data.lab;
          document.getElementById('valL').innerText = L.toFixed(1);
          document.getElementById('valA').innerText = a.toFixed(1);
          document.getElementById('valB').innerText = b.toFixed(1);
          updateCatalogSearch(L, a, b, data.refl);
        }
      } catch (e) {
        console.error("JSON parse error:", e);
      }
    }

    async function sendScanCmd() {
      if (!rxChar) {
        alert("Прибор не подключен по BLE");
        return;
      }
      const encoder = new TextEncoder();
      await rxChar.writeValue(encoder.encode("SCAN\n"));
    }

    function exportData() {
      if (!lastReportData) {
        alert("Нет данных для экспорта");
        return;
      }
      const text = `Замер Color Station PRO\nАртикул: ${lastReportData.code} (${lastReportData.name})\nДельта: ΔE ${lastReportData.dE}\nКаталог: ${lastReportData.catalog}`;
      navigator.clipboard.writeText(text).then(() => alert("Данные скопированы в буфер обмена!"));
    }
