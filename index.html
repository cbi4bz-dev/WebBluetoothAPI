<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RAL Core Colorimeter</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(22, 27, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    }

    /* ЭКРАН 1: СТИЛИЗОВАННЫЙ ВЫКЛЮЧАТЕЛЬ */
    #connectScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 16px;
      text-align: center;
    }
    .hero-text h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-text p {
      font-size: 15px;
      color: var(--text-dim);
    }

    /* 3D Неоновый тумблер */
    .switch-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .power-switch {
      width: 110px;
      height: 190px;
      background: #111622;
      border-radius: 55px;
      padding: 10px;
      box-shadow: 
        inset 0 4px 12px rgba(0,0,0,0.8),
        0 0 0 1px rgba(255,255,255,0.06),
        0 20px 40px rgba(0,0,0,0.6);
      cursor: pointer;
      position: relative;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .power-knob {
      width: 90px;
      height: 90px;
      background: linear-gradient(145deg, #1e2638, #151b27);
      border-radius: 50%;
      box-shadow: 
        0 8px 20px rgba(0,0,0,0.6),
        inset 0 1px 1px rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s;
    }
    .power-icon {
      width: 32px;
      height: 32px;
      stroke: var(--text-dim);
      stroke-width: 2.5;
      fill: none;
      transition: stroke 0.3s, filter 0.3s;
    }
    .power-switch.connecting .power-knob {
      transform: translateY(80px);
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      box-shadow: 0 0 30px var(--accent-glow);
    }
    .power-switch.connecting .power-icon {
      stroke: #fff;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
    }
    .switch-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ЭКРАН 2: ПРИБОРНАЯ ПАНЕЛЬ */
    #dashboardScreen {
      flex: 1;
      display: none;
      flex-direction: column;
      gap: 14px;
      padding-top: 10px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .conn-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--success);
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }
    .btn-off {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ГИГАНТСКАЯ ДОМИНИРУЮЩАЯ ПЛАШКА */
    .dominant-swatch {
      flex: 1.4;
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #161b26;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      transition: background-color 0.4s ease;
      min-height: 220px;
    }
    .swatch-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .quality-pill {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .lab-capsule {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255,255,255,0.9);
    }
    .swatch-body {
      display: flex;
      flex-direction: column;
    }
    .main-ral {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .main-name {
      font-size: 20px;
      font-weight: 600;
      margin-top: 6px;
      opacity: 0.9;
    }

    /* ПАНЕЛЬ МЕТРИК */
    .metrics-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 18px;
    }
    .metric-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-num {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .metric-unit {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
    }

    /* АЛЬТЕРНАТИВЫ */
    .alts-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .alts-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-left: 4px;
    }
    .alt-tile {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 14px;
      gap: 14px;
    }
    .alt-capsule {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }
    .alt-info {
      flex: 1;
    }
    .alt-ral-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .alt-de-tag {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ВЫКЛЮЧАТЕЛЬ -->
  <section id="connectScreen">
    <div class="hero-text">
      <h1>RAL Core Pro</h1>
      <p>Спектроколориметрическая станция</p>
    </div>

    <div class="switch-wrapper">
      <div id="powerBtn" class="power-switch" onclick="handlePowerToggle()">
        <div class="power-knob">
          <svg class="power-icon" viewBox="0 0 24 24">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div id="switchStatus" class="switch-label">Нажмите для старта</div>
    </div>

    <div style="font-size: 12px; color: rgba(255,255,255,0.2);">ESP32-C3 Engine • CIEDE2000</div>
  </section>

  <!-- ЭКРАН 2: ДАШБОРД ЗАМЕРОВ -->
  <section id="dashboardScreen">
    <div class="top-nav">
      <div class="conn-status">
        <div class="pulse-dot"></div>
        <span>Онлайн</span>
      </div>
      <button class="btn-off" onclick="disconnectDevice()">Выключить</button>
    </div>

    <!-- Крупная плашка цвета -->
    <div id="dominantSwatch" class="dominant-swatch">
      <div class="swatch-header">
        <div id="qualityPill" class="quality-pill">ОЖИДАНИЕ ЗАМЕРА</div>
        <div id="labValues" class="lab-capsule">L: -- a: -- b: --</div>
      </div>
      <div class="swatch-body">
        <div id="ralCode" class="main-ral">RAL ----</div>
        <div id="ralName" class="main-name">Приложите датчик к детали</div>
      </div>
    </div>

    <!-- Показатели -->
    <div class="metrics-panel">
      <div class="metric-card">
        <div class="metric-title">Погрешность</div>
        <div class="metric-num"><span id="deVal">0.00</span> <span class="metric-unit">ΔE00</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Сходство</div>
        <div class="metric-num"><span id="confVal">0</span> <span class="metric-unit">%</span></div>
      </div>
    </div>

    <!-- Альтернативы -->
    <div class="alts-wrapper">
      <div class="alts-title">Ближайшие совпадения каталога</div>

      <div class="alt-tile">
        <div id="alt1Swatch" class="alt-capsule"></div>
        <div class="alt-info">
          <div id="alt1Code" class="alt-ral-name">RAL ----</div>
        </div>
        <div id="alt1De" class="alt-de-tag">ΔE --</div>
      </div>

      <div class="alt-tile">
        <div id="alt2Swatch" class="alt-capsule"></div>
        <div class="alt-info">
          <div id="alt2Code" class="alt-ral-name">RAL ----</div>
        </div>
        <div id="alt2De" class="alt-de-tag">ΔE --</div>
      </div>
    </div>
  </section>

<script>
  const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  let bleDevice = null;

  // База эталонных Lab для вычисления альтернативных плашек
  const ralRefLab = {
    "RAL 1000": [76.5, 1.2, 28.1],   "RAL 1001": [75.8, 5.7, 26.2],   "RAL 1002": [73.2, 7.4, 39.6],
    "RAL 1013": [86.8, 0.4, 10.8],   "RAL 1014": [80.4, 3.7, 24.1],   "RAL 1015": [84.4, 2.8, 16.9],
    "RAL 1019": [64.2, 3.8, 15.4],   "RAL 1020": [60.8, 1.2, 25.6],   "RAL 1023": [78.4, 11.2, 78.8],
    "RAL 1035": [56.4, 2.2, 10.8],   "RAL 2002": [45.8, 51.4, 44.2],  "RAL 3000": [45.2, 50.1, 37.4],
    "RAL 3001": [41.2, 50.8, 32.1],  "RAL 3007": [21.2, 18.4, 5.6],   "RAL 3012": [61.4, 21.8, 22.4],
    "RAL 3014": [58.4, 32.8, 16.8],  "RAL 3015": [69.8, 24.1, 11.8],  "RAL 3016": [44.2, 41.8, 31.2],
    "RAL 3018": [48.4, 52.1, 24.6],  "RAL 3020": [46.9, 59.8, 44.5],  "RAL 3027": [41.2, 52.4, 26.4],
    "RAL 3028": [45.8, 62.4, 43.1],  "RAL 5001": [31.2, -16.4, -21.2],"RAL 5002": [24.1, 13.5, -44.8],
    "RAL 5003": [22.4, 0.8, -24.1],  "RAL 5005": [33.2, -1.9, -37.2], "RAL 5013": [20.8, 3.4, -26.4],
    "RAL 5015": [48.2, -13.5, -31.7],"RAL 5017": [28.4, -7.4, -28.4], "RAL 5019": [37.4, -12.4, -27.4],
    "RAL 5022": [21.2, 8.4, -31.2],  "RAL 6004": [26.4, -18.4, -2.4], "RAL 6016": [40.1, -36.4, 8.4],
    "RAL 6026": [36.4, -34.2, 4.8],  "RAL 6028": [35.4, -18.4, 4.8],  "RAL 6036": [32.1, -28.4, 2.4],
    "RAL 7004": [65.4, -0.4, -0.8],  "RAL 7016": [29.3, -0.6, -3.7],  "RAL 7024": [33.7, -0.7, -2.9],
    "RAL 7032": [72.4, -0.4, 7.8],   "RAL 7034": [58.4, -0.4, 10.8],  "RAL 7035": [82.1, -1.0, 0.8],
    "RAL 7036": [62.4, 0.8, 0.4],    "RAL 7038": [73.4, -0.8, 2.4],   "RAL 7040": [67.2, -1.4, -2.8],
    "RAL 7044": [73.8, 0.4, 6.4],    "RAL 8014": [26.4, 9.8, 12.4],   "RAL 8016": [25.4, 17.4, 14.2],
    "RAL 8017": [25.8, 7.6, 9.8],    "RAL 8022": [16.4, 0.8, 0.8],    "RAL 9001": [91.2, -0.8, 5.8],
    "RAL 9003": [95.2, -0.6, 1.8],   "RAL 9005": [5.1, 0.1, -0.5],    "RAL 9006": [68.4, -0.8, 0.4],
    "RAL 9010": [93.8, 0.2, 5.1],    "RAL 9011": [16.4, -0.4, -0.8],  "RAL 9016": [96.1, -0.2, 1.1],
    "RAL 9017": [16.8, 0.2, -0.2]
  };

  function labToRgb(L, a, b) {
    let y = (L + 16) / 116;
    let x = a / 500 + y;
    let z = y - b / 200;

    const fn = (t) => t > 0.206893 ? Math.pow(t, 3) : (t - 16/116) / 7.787;
    x = 0.95047 * fn(x);
    y = 1.00000 * fn(y);
    z = 1.08883 * fn(z);

    let r = x *  3.2406 + y * -1.5372 + z * -0.4986;
    let g = x * -0.9689 + y *  1.8758 + z *  0.0415;
    let bl = x *  0.0557 + y * -0.2040 + z *  1.0570;

    const gamma = (c) => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055;
    r = Math.min(255, Math.max(0, Math.round(gamma(r) * 255)));
    g = Math.min(255, Math.max(0, Math.round(gamma(g) * 255)));
    bl = Math.min(255, Math.max(0, Math.round(gamma(bl) * 255)));

    return `rgb(${r}, ${g}, ${bl})`;
  }

  function getRalColor(ralCode) {
    if (ralRefLab[ralCode]) {
      const [l, a, b] = ralRefLab[ralCode];
      return labToRgb(l, a, b);
    }
    return "#1e293b";
  }

  async function handlePowerToggle() {
    const sw = document.getElementById('powerBtn');
    const label = document.getElementById('switchStatus');

    sw.classList.add('connecting');
    label.innerText = "Поиск прибора...";

    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: "RAL-Scanner-PRO" }],
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      label.innerText = "Соединение...";
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const txChar = await service.getCharacteristic(CHAR_TX_UUID);

      await txChar.startNotifications();
      txChar.addEventListener('characteristicvaluechanged', handleTelemetry);

      // Переход на экран дашборда
      document.getElementById('connectScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'flex';

    } catch (err) {
      sw.classList.remove('connecting');
      label.innerText = "Нажмите для старта";
      console.log("Connect cancelled or failed", err);
    }
  }

  function disconnectDevice() {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    document.getElementById('dashboardScreen').style.display = 'none';
    document.getElementById('connectScreen').style.display = 'flex';
    document.getElementById('powerBtn').classList.remove('connecting');
    document.getElementById('switchStatus').innerText = "Нажмите для старта";
  }

  function handleTelemetry(event) {
    const raw = new TextDecoder().decode(event.target.value);
    try {
      const data = JSON.parse(raw);

      document.getElementById('ralCode').innerText = data.ral;
      document.getElementById('ralName').innerText = data.name;
      document.getElementById('deVal').innerText = Number(data.dE).toFixed(2);
      document.getElementById('confVal').innerText = data.confidence;

      const pill = document.getElementById('qualityPill');
      pill.innerText = data.quality;
      if (data.dE < 2.0) {
        pill.style.color = "#4ade80";
      } else if (data.dE < 4.0) {
        pill.style.color = "#facc15";
      } else {
        pill.style.color = "#f87171";
      }

      // Главный замер
      if (data.lab) {
        const rgb = labToRgb(data.lab[0], data.lab[1], data.lab[2]);
        const swatch = document.getElementById('dominantSwatch');
        swatch.style.backgroundColor = rgb;
        document.getElementById('labValues').innerText = 
          `L: ${Number(data.lab[0]).toFixed(1)}  a: ${Number(data.lab[1]).toFixed(1)}  b: ${Number(data.lab[2]).toFixed(1)}`;

        // Авто-контраст шрифта под светлоту L
        const textColor = data.lab[0] > 65 ? '#090d16' : '#ffffff';
        document.getElementById('ralCode').style.color = textColor;
        document.getElementById('ralName').style.color = textColor;
      }

      // Альтернативы
      if (data.alternatives && data.alternatives.length >= 2) {
        const a1 = data.alternatives[0];
        const a2 = data.alternatives[1];

        document.getElementById('alt1Code').innerText = a1.ral;
        document.getElementById('alt1De').innerText = `ΔE ${Number(a1.dE).toFixed(1)}`;
        document.getElementById('alt1Swatch').style.backgroundColor = getRalColor(a1.ral);

        document.getElementById('alt2Code').innerText = a2.ral;
        document.getElementById('alt2De').innerText = `ΔE ${Number(a2.dE).toFixed(1)}`;
        document.getElementById('alt2Swatch').style.backgroundColor = getRalColor(a2.ral);
      }

    } catch (e) {
      console.warn("Telemetry Parse Error", e);
    }
  }
</script>

</body>
</html>
